[project]
name = "qcc-executor"
version = "0.1.0"
description = "QCC Executor — gRPC sidecar that runs quantum circuits via vendor adapters"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.68",
    "protobuf>=5.29",
    "qiskit>=1.3",
    "qiskit-aer>=0.16",
    "qiskit-ibm-runtime>=0.34",
    "qiskit-qasm3-import>=0.5",
]

[project.scripts]
qcc-executor = "qcc_executor.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcc_executor"]

[dependency-groups]
dev = [
    "grpcio-tools>=1.68",
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/qcc_executor/proto"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
