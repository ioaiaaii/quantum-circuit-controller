apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: quantum-circuit-controller
    control-plane: controller-manager
  name: quantum-circuit-controller-controller-manager
  namespace: quantum-circuit-controller-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quantum-circuit-controller
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: quantum-circuit-controller
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /qcc-controller
        env:
        - name: QCC_EXECUTOR_ADDR
          value: quantum-circuit-controller-executor:9000
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: otelcol-opentelemetry-collector.monitoring.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: "true"
        - name: OTEL_SERVICE_NAME
          value: qcc-controller
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: K8S_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: K8S_NAMESPACE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: qcc-controller:chore-ci-fixes
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: quantum-circuit-controller-controller-manager
      terminationGracePeriodSeconds: 10
      volumes: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: executor
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: quantum-circuit-controller
  name: quantum-circuit-controller-executor
  namespace: quantum-circuit-controller-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: executor
      app.kubernetes.io/name: quantum-circuit-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/component: executor
        app.kubernetes.io/name: quantum-circuit-controller
    spec:
      containers:
      - env:
        - name: QCC_EXECUTOR_LOG_LEVEL
          value: INFO
        - name: QCC_EXECUTOR_WORKERS
          value: "8"
        - name: QISKIT_IBM_TOKEN
          valueFrom:
            secretKeyRef:
              key: QISKIT_IBM_TOKEN
              name: ibm-quantum-token
              optional: true
        - name: QISKIT_IBM_CHANNEL
          valueFrom:
            secretKeyRef:
              key: QISKIT_IBM_CHANNEL
              name: ibm-quantum-token
              optional: true
        image: qcc-executor:chore-ci-fixes
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 15
          periodSeconds: 20
          tcpSocket:
            port: grpc
        name: qcc-executor
        ports:
        - containerPort: 9000
          name: grpc
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: grpc
        resources:
          limits:
            cpu: "2"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
