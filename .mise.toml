# Toolchain pinning for the Quantum Circuit Controller, that kubebuilder does not provide.
[tools]
python = "3.12"
uv = "0.12"
# macOS ships 3.81, where .SHELLFLAGS is silently ignored
make = "4.4"
jq = "1.8"
kubectl = "1.35"
kind = "0.32"
helm = "3.16"
kubebuilder = "4.15"
buf = "1.50"
"aqua:lycheeverse/lychee" = "0.24"
"aqua:charmbracelet/vhs" = "0.11"

[settings]
experimental = true
