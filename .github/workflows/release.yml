name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      # Build provenance for the CLI binaries.
      id-token: write
      attestations: write
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
          # Fetch the entire history for the changelog.
          fetch-depth: 0

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Build CLI binaries
        run: make qcc-dist

      # Consumers verify with: gh attestation verify <file> --owner ioaiaaii
      - name: Attest CLI build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/qcc-*

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: make op-changelog-release TAG="$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/notes.md"
          dist/qcc-* dist/SHA256SUMS
