name: Docs

# Runs when documentation changes: any markdown file, or anything under
# docs/ (the doc images live there too). Known trade-off: renaming a file
# that docs link to (e.g. the proto) without touching markdown skips this
# check; the break then surfaces on the next docs PR or a local
# `make docs-check`.
on:
  push:
    paths:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"

permissions: {}

jobs:
  links:
    permissions:
      contents: read
    name: Check links and anchors
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up mise (provisions lychee)
        uses: jdx/mise-action@5083fe46898c414b2475087cc79da59e7da859e8 # v3.5.0
        with:
          experimental: true

      - name: Check links and anchors (offline)
        run: make docs-check
