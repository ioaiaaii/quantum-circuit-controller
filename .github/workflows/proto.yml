name: Proto

on:
  push:
    branches: [main]
    paths:
      - "proto/**"
      - "gen/**"
  pull_request:
    paths:
      - "proto/**"
      - "gen/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    permissions:
      contents: read
    name: Lint Protos
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
          # proto-breaking diffs against origin/main.
          fetch-depth: 0

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          go: "false"

      - name: Buf lint
        run: make proto-lint

      - name: Buf breaking
        run: make proto-breaking
