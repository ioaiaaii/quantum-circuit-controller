name: CD

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  images:
    permissions:
      contents: read
      packages: write
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # Attestations need a docker-container builder.
      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish both images
        run: >
          make images-build
          IMAGE_MODE=publish
          IMAGE_REPO=ghcr.io/ioaiaaii
          IMAGE_TAG=${{ github.sha }}

      - name: Record digests
        run: |
          make op-image-digest IMAGE_NAME=qcc-controller >> "$GITHUB_STEP_SUMMARY"
          make op-image-digest IMAGE_NAME=qcc-executor >> "$GITHUB_STEP_SUMMARY"

      - name: Render the installer against the published images
        run: >
          make build-installer
          IMG=ghcr.io/ioaiaaii/qcc-controller:${{ github.sha }}
          EXECUTOR_IMG=ghcr.io/ioaiaaii/qcc-executor:${{ github.sha }}

      - name: Upload install.yaml
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-yaml
          path: dist/install.yaml
