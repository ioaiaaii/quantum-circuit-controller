name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  images:
    permissions:
      contents: read
      packages: write
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          go: "false"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Attestations need a docker-container builder.
      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # amd64 only: the arm64 leg runs under QEMU on hosted runners, which
      # is slow and flaky. Native arm runners are free once the repo is
      # public; revisit then.
      # Branch pushes publish the moving `edge` tag, tag pushes publish
      # their version. `latest` stays reserved for releases.
      - name: Build and publish QCC images
        run: >
          make images-build
          IMAGE_MODE=publish
          IMAGE_REPO=ghcr.io/ioaiaaii
          IMAGE_PLATFORMS=linux/amd64
          IMAGE_TAG=${{ github.ref_type == 'branch' && 'edge' || github.ref_name }}
