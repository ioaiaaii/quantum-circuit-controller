name: CD

# GitHub does not evaluate path filters for tag pushes, so releases
# always build.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**.go"
      - "!**_test.go"
      - "!test/**"
      - "go.mod"
      - "go.sum"
      - "qcc-executor/**"
      - "!qcc-executor/tests/**"
      - "build/package/**"
      - "build/makefiles/**"
      - "build/repo-operator"
      - ".github/actions/**"
      - ".github/workflows/cd.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  images:
    permissions:
      contents: read
      packages: write
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          go: "false"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU covers the executor's arm64 leg; the controller cross-compiles.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # Attestations need a docker-container builder.
      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Branch pushes publish `edge`, tag pushes their version.
      - name: Build and publish QCC images
        run: >
          make images-build
          IMAGE_MODE=publish
          IMAGE_REPO=ghcr.io/ioaiaaii
          IMAGE_TAG=${{ github.ref_type == 'branch' && 'edge' || github.ref_name }}
