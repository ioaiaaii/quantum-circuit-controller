# qcc-executor: Python gRPC service owning the Qiskit dependency.
apiVersion: v1
kind: Service
metadata:
  name: executor
  namespace: system
  labels:
    app.kubernetes.io/name: quantum-circuit-controller
    app.kubernetes.io/component: executor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: quantum-circuit-controller
    app.kubernetes.io/component: executor
  ports:
    - name: grpc
      port: 9000
      targetPort: grpc
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  namespace: system
  labels:
    app.kubernetes.io/name: quantum-circuit-controller
    app.kubernetes.io/component: executor
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quantum-circuit-controller
      app.kubernetes.io/component: executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantum-circuit-controller
        app.kubernetes.io/component: executor
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qcc-executor
          image: qcc-executor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9000
              protocol: TCP
          env:
            - name: QCC_EXECUTOR_LOG_LEVEL
              value: INFO
            - name: QCC_EXECUTOR_WORKERS
              value: "8"
            # Optional IBM credential, created out of band. Absent, the IBM
            # adapter reports unavailable and Aer circuits still run.
            - name: QISKIT_IBM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ibm-quantum-token
                  key: QISKIT_IBM_TOKEN
                  optional: true
            - name: QISKIT_IBM_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: ibm-quantum-token
                  key: QISKIT_IBM_CHANNEL
                  optional: true
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          # Qiskit + Aer is memory-hungry next to the Go controller.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            # uv writes lock files under /app at runtime.
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
      terminationGracePeriodSeconds: 10
