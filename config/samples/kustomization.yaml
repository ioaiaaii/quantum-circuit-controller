## Append samples of your project ##
#
# Layout:
#   - This kustomization aggregates *all* sample CRs.  Apply with
#     `kubectl apply -k config/samples/` to register everything.
#   - `qpu/` is the fake-backend simulator bundle (fake-brisbane,
#     fake-sherbrooke, fake-osaka, fake-torino).  Apply just that
#     bundle with `kubectl apply -k config/samples/qpu/`.
#   - The IBM hardware QPU below is a placeholder — it goes
#     Unknown until QISKIT_IBM_TOKEN + the IBM adapter land in M2.
#   - There is no `qpu_local.yaml` sample because `local-aer` ships
#     by default via `config/qpu/` — every cluster already has it.
resources:
- qcc_v1alpha1_circuit.yaml
- qcc_v1alpha1_circuit_selectonly.yaml
# Tier 2 passthrough demos (§7a Composition Principle):
#   - `_seeded` pins seed_simulator + seed_transpiler for reproducibility.
#   - `_tier2_layout` shows non-seed transpile kwargs (layout/routing).
- qcc_v1alpha1_circuit_seeded.yaml
- qcc_v1alpha1_circuit_tier2_layout.yaml
- qcc_v1alpha1_qpu_ibm_sherbrooke.yaml
- qpu
# +kubebuilder:scaffold:manifestskustomizesamples
