apiVersion: qcc.io/v1alpha1
kind: Circuit
metadata:
  name: bell-state-select
  labels:
    app.kubernetes.io/name: quantum-circuit-controller
spec:
  mode: select
  source:
    format: openqasm3
    body: |
      OPENQASM 3.0;
      include "stdgates.inc";
      qubit[2] q;
      bit[2] c;
      h q[0];
      cx q[0], q[1];
      c[0] = measure q[0];
      c[1] = measure q[1];
