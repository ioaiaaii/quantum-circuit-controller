# fake-marrakesh — IBM Heron r2, 156 qubits, CZ basis.  *Newer*
# architecture than Torino's Heron r1 — same generation family but
# improved calibration.  Including Marrakesh lets the demo show that
# scoring needs to recognise generation improvements separately from
# per-snapshot calibration variance (Heron r2 ≠ better Heron r1).
apiVersion: qcc.io/v1alpha1
kind: QPU
metadata:
  name: fake-marrakesh
  labels:
    app.kubernetes.io/name: quantum-circuit-controller
    app.kubernetes.io/managed-by: kustomize
    qcc.io/provider: local
    qcc.io/family: heron-r2
spec:
  provider: local
  kind: simulator
