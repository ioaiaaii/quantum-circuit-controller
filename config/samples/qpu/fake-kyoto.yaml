# fake-kyoto — IBM Eagle r3, 127 qubits, ECR basis.  Fourth Eagle r3
# fake, different calibration snapshot from Brisbane/Sherbrooke/Osaka.
# Including Kyoto thickens the Eagle r3 comparator set so the
# calibration-variance demo isn't just a 3-point comparison.
apiVersion: qcc.io/v1alpha1
kind: QPU
metadata:
  name: fake-kyoto
  labels:
    app.kubernetes.io/name: quantum-circuit-controller
    app.kubernetes.io/managed-by: kustomize
    qcc.io/provider: local
    qcc.io/family: eagle-r3
spec:
  provider: local
  kind: simulator
