apiVersion: v1
kind: Service
metadata:
  name: {{ include "qcc.executorServiceName" . }}
  labels: {{- include "qcc.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
spec:
  type: {{ .Values.executor.service.type }}
  ports:
    - name: grpc
      port: {{ .Values.executor.service.port }}
      targetPort: grpc
      protocol: TCP
  selector: {{- include "qcc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: executor
