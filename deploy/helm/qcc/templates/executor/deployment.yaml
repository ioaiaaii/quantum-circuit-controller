{{- if gt (int .Values.executor.replicaCount) 1 }}
{{- fail "executor.replicaCount must be 1: job results live in process memory" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qcc.executorServiceName" . }}
  labels: {{- include "qcc.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
spec:
  replicas: {{ .Values.executor.replicaCount }}
  {{- with .Values.executor.updateStrategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "qcc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: executor
  template:
    metadata:
      {{- with .Values.executor.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
      labels: {{- include "qcc.labels" . | nindent 8 }}
        app.kubernetes.io/component: executor
    spec:
      automountServiceAccountToken: {{ .Values.executor.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.executor.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.executor.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.executor.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.executor.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.executor.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.executor.priorityClassName }}
      priorityClassName: {{ .Values.executor.priorityClassName | quote }}
      {{- end }}
      {{- with .Values.executor.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: qcc-executor
          image: {{ include "qcc.executorImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.executor.env }}
          env: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.executor.service.port }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.executor.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.executor.containerSecurityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
