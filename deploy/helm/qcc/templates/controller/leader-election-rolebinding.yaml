{{- if and .Values.rbac.create .Values.controller.leaderElection -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "qcc.fullname" . }}-leader-election
  labels: {{- include "qcc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "qcc.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "qcc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
