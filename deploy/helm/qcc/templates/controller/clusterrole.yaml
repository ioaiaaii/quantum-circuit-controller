{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "qcc.fullname" . }}-manager
  labels: {{- include "qcc.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [qcc.io]
    resources: [circuits, qpus]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [qcc.io]
    resources: [circuits/finalizers, qpus/finalizers]
    verbs: [update]
  - apiGroups: [qcc.io]
    resources: [circuits/status, qpus/status]
    verbs: [get, patch, update]
{{- end }}
