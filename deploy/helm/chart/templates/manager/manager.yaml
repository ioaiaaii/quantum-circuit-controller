apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: executor
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "quantum-circuit-controller.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "quantum-circuit-controller.resourceName" (dict "suffix" "executor" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: executor
      app.kubernetes.io/name: {{ include "quantum-circuit-controller.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: executor
        app.kubernetes.io/name: {{ include "quantum-circuit-controller.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      containers:
      - env:
        - name: QCC_EXECUTOR_LOG_LEVEL
          value: INFO
        - name: QCC_EXECUTOR_WORKERS
          value: "8"
        - name: QISKIT_IBM_TOKEN
          valueFrom:
            secretKeyRef:
              key: QISKIT_IBM_TOKEN
              name: ibm-quantum-token
              optional: true
        - name: QISKIT_IBM_CHANNEL
          valueFrom:
            secretKeyRef:
              key: QISKIT_IBM_CHANNEL
              name: ibm-quantum-token
              optional: true
        image: qcc-executor:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 15
          periodSeconds: 20
          tcpSocket:
            port: grpc
        name: qcc-executor
        ports:
        - containerPort: 9000
          name: grpc
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: grpc
        resources:
          limits:
            cpu: "2"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
