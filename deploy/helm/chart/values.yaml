# Partially override the generated resource names, keeping the release name.
# nameOverride: ""
# Fully override the generated resource names.
# fullnameOverride: ""

# qcc-controller — the operator. Reconciles Circuit and QPU resources and
# dials the executor over gRPC.
manager:
  enabled: true
  replicas: 1

  image:
    repository: qcc-controller
    # Defaults to .Chart.AppVersion. Set a repository containing "@sha256:"
    # to pin by digest, in which case the tag is ignored.
    tag: ""
    pullPolicy: IfNotPresent

  # Extra args appended after --leader-elect and the probe/metrics flags.
  args: []

  # Extra environment on top of QCC_EXECUTOR_ADDR, the OTEL_* settings and the
  # downward-API pod attributes, all of which the template sets.
  extraEnv: []

  # OpenTelemetry. Endpoint is OTLP/gRPC; empty disables the exporter.
  otel:
    endpoint: otelcol-opentelemetry-collector.monitoring.svc.cluster.local:4317
    # In-cluster collectors terminate plain text; the SDK would otherwise
    # attempt TLS and fail the handshake.
    insecure: true
    serviceName: qcc-controller

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  terminationGracePeriodSeconds: 10
  affinity: {}
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []
  # priorityClassName: ""
  # strategy: {}
  # imagePullSecrets: []
  labels: {}
  annotations: {}
  pod:
    labels: {}
    annotations: {}

# qcc-executor — Python gRPC service owning the Qiskit dependency. A separate
# Deployment so it scales independently of the controller and the wire between
# them stays a network boundary.
executor:
  enabled: true
  replicas: 1

  image:
    repository: qcc-executor
    tag: ""
    pullPolicy: IfNotPresent

  service:
    port: 9000

  logLevel: INFO
  workers: 8

  # IBM Quantum credentials. Optional: absent, the IBM adapter reports itself
  # unavailable and Aer-backed Circuits still run. Create out of band:
  #   kubectl create secret generic ibm-quantum-token \
  #     --from-literal=QISKIT_IBM_TOKEN='<token>'
  ibmSecret:
    name: ibm-quantum-token
    optional: true

  extraEnv: []

  # Qiskit and Aer are memory-hungry next to the Go controller.
  resources:
    limits:
      cpu: "2"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    # uv writes lock files under /app at runtime.
    readOnlyRootFilesystem: false

  terminationGracePeriodSeconds: 10
  affinity: {}
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []
  labels: {}
  annotations: {}
  pod:
    labels: {}
    annotations: {}

rbac:
  # false: ClusterRole/ClusterRoleBinding across all namespaces.
  # true:  Role/RoleBinding scoped to the release namespace.
  namespaced: false
  helpers:
    # Convenience admin/editor/viewer ClusterRoles for Circuit and QPU.
    enabled: false

serviceAccount:
  enabled: true
  # Existing ServiceAccount to use when enabled is false.
  # name: ""
  annotations: {}
  labels: {}

crd:
  enabled: true
  # Leave CRDs in place on uninstall, so Circuits and QPUs survive.
  keep: true

metrics:
  enabled: true
  port: 8443
  # HTTPS with authn/authz (true) or plain HTTP (false). Secure mode needs the
  # metrics-auth ClusterRole.
  secure: true

certManager:
  enabled: false

prometheus:
  enabled: false

networkPolicy:
  enabled: false
