# kube-prometheus-stack — local dev profile for QCC
# Chart: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
#
# Trade-offs vs. defaults:
#   - Alertmanager + node-exporter + default PrometheusRules disabled (noise/RAM)
#   - Prometheus retention dropped to 24h (dev, no archival)
#   - Prometheus watches ALL ServiceMonitors regardless of release label
#     (so OTel Collector and QCC controller's ServiceMonitors are picked up)

alertmanager:
  enabled: false

defaultRules:
  create: false

prometheus-node-exporter:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 24h
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

grafana:
  adminPassword: admin
  service:
    type: ClusterIP
  defaultDashboardsEnabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
