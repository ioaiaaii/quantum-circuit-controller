# Tempo monolith — local dev profile for QCC
# Chart: https://github.com/grafana/helm-charts/tree/main/charts/tempo
#
# Trade-offs vs. defaults:
#   - In-memory storage (no PVC) — traces lost on Pod restart, fine for dev
#   - OTLP gRPC + HTTP receivers explicitly enabled (chart default is jaeger only)

tempo:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

persistence:
  enabled: false

service:
  type: ClusterIP
